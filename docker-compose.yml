services:

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: prometheus-v2-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker

    volumes:
      - prometheus_v2_postgres_data:/var/lib/postgresql

    networks:
      - prometheus_v2

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: ${N8N_IMAGE}
    container_name: prometheus-v2-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5679:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}

      N8N_RUNNERS_MODE: ${N8N_RUNNERS_MODE}

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}

    volumes:
      - prometheus_v2_n8n_data:/home/node/.n8n

    networks:
      - prometheus_v2

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    container_name: prometheus-v2-seaweedfs
    restart: unless-stopped

    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0

    environment:
      TZ: ${TZ}

    ports:
      - "8334:8333"

    volumes:
      - prometheus_v2_seaweedfs_data:/data
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

    networks:
      - prometheus_v2


  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    container_name: prometheus-v2-renderer
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - prometheus_v2_renderer_input:/workspace/input
      - prometheus_v2_renderer_output:/workspace/output
      - prometheus_v2_renderer_tmp:/workspace/tmp
    networks:
      - prometheus_v2
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  prometheus_v2:
    name: prometheus-v2-network
    driver: bridge


volumes:
  prometheus_v2_postgres_data:
    name: prometheus-v2-postgres-data

  prometheus_v2_n8n_data:
    name: prometheus-v2-n8n-data

  prometheus_v2_seaweedfs_data:
    name: prometheus-v2-seaweedfs-data


  prometheus_v2_renderer_input:
    name: prometheus-v2-renderer-input

  prometheus_v2_renderer_output:
    name: prometheus-v2-renderer-output

  prometheus_v2_renderer_tmp:
    name: prometheus-v2-renderer-tmp


